version: 2

models:
  - name: fct_daily_demand
    description: "Daily demand facts per store × department. Used by forecasting model and Kafka anomaly detection."
    columns:
      - name: sale_date
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: fct_product_performance
    description: "Aggregate product performance from UK transactions"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: total_revenue
        tests:
          - not_null

  - name: dim_stores
    description: "Store dimension with all-time metrics"
    columns:
      - name: store_id
        tests:
          - not_null
          - unique
  - name: mart_executive_kpis
    description: "Daily business KPIs from UK transactions — revenue, orders, basket size, WoW trends"
    columns:
      - name: kpi_date
        tests:
          - not_null
          - unique
      - name: total_revenue
        tests:
          - not_null

  - name: mart_recsys_interactions
    description: "Clean user-item interaction matrix for recommendation API serving"
    columns:
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
