version: 2

models:
  - name: int_daily_store_sales
    description: "Daily aggregated sales per store × department × category. Feeds fct_daily_demand and store baselines."
    columns:
      - name: sale_date
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: total_units
        tests:
          - not_null

  - name: int_user_product_interactions
    description: "User × product interaction aggregates with implicit feedback score. Feeds two-tower recommendation model."
    columns:
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: interaction_score
        tests:
          - not_null

  - name: int_customer_rfm
    description: "RFM (Recency, Frequency, Monetary) scores per customer from UK transactions. Feeds Streamlit dashboard."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: recency_days
        tests:
          - not_null
      - name: frequency_score
        tests:
          - not_null
      - name: monetary_score
        tests:
          - not_null
